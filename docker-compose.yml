services:
  nr-news:
    build: .
    image: nr-newsroom:latest
    container_name: nr-newsroom
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8000:8000"
    environment:
      TZ: Asia/Kolkata
      NR_DRY_RUN: "true"
      NR_PUBLISH_ENABLED: "false"
      NR_PUBLISH_SAFETY_OK: "false"
      NR_OPERATOR_APPROVED: "false"
      NR_VERIFY_APPROVED: "false"
      NR_AUTO_APPROVE_VERIFIED: "false"
      NR_VIDEO_ENABLED: "false"
      NR_GRAPH_API_VERSION: "v26.0"
      NR_PORT: "8000"
      NR_EXPECTED_PAGE_NAME: "${NR_EXPECTED_PAGE_NAME:-}"
      NR_LLM_API_BASE: "${NR_LLM_API_BASE:-https://api.openai.com/v1}"
      NR_LLM_MODEL: "${NR_LLM_MODEL:-}"
      NR_ROMAN_URDU_MODEL: "${NR_ROMAN_URDU_MODEL:-}"
      NR_VALIDATOR_MODEL: "${NR_VALIDATOR_MODEL:-}"
      NR_LLM_API_KEY: "${NR_LLM_API_KEY:-}"
      NR_FB_USER_ACCESS_TOKEN: "${NR_FB_USER_ACCESS_TOKEN:-}"
      NR_FB_PAGE_ACCESS_TOKEN: "${NR_FB_PAGE_ACCESS_TOKEN:-}"
      NR_ADMIN_TOKEN: "${NR_ADMIN_TOKEN:-}"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
