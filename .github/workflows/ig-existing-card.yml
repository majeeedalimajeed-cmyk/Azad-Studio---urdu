name: One-time Instagram verified card
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: hourly-newsroom
  cancel-in-progress: false
jobs:
  instagram:
    runs-on: ubuntu-latest
    env:
      NR_FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      NR_FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      NR_GRAPH_API_VERSION: ${{ vars.NR_GRAPH_API_VERSION || 'v26.0' }}
      NR_GITHUB_LEDGER_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Publish verified card once to linked Instagram
        run: python scripts/publish_ig_existing_card.py
