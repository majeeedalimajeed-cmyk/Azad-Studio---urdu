name: Publish approved AICTE card
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: approved-aicte-card-20261102
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NR_SKIP_DOTENV: '1'
      NR_FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      NR_FB_USER_ACCESS_TOKEN: ${{ secrets.FB_USER_ACCESS_TOKEN }}
      NR_FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      NR_GRAPH_API_VERSION: ${{ vars.NR_GRAPH_API_VERSION }}
      NR_EXPECTED_PAGE_NAME: ${{ vars.NR_EXPECTED_PAGE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Publish the single approved card
        run: |
          python - <<'PY'
          import json, os, sys
          from nr_news.facebook import FacebookGraphClient
          from nr_news.config import CONFIG
          if int(os.environ.get('GITHUB_RUN_ATTEMPT', '1')) != 1:
              print('HOLD: no automatic reruns; verify the first post manually.')
              sys.exit(1)
          client = FacebookGraphClient(config=CONFIG)
          identity = client.verify_identity()
          if not identity.get('ok'):
              print('HOLD: Page identity verification failed:', identity.get('reason'))
              sys.exit(1)
          caption = ('AICTE has launched four schemes for technical institutions in 2026–27, covering practical learning, lab modernisation, mentoring and academic conferences.\n\n'
                     'AICTE ne technical idaron ke liye amali taleem, labs, rehnumai aur conferences se mutalliq chaar schemes ka elan kiya.\n\n'
                     'AZAD-STUDIO-AICTE-20261102')
          result = client.publish_photo(identity['page_id'], 'approved_cards/2026-11-02-aicte.png', caption)
          print(json.dumps({'status':'published','post_id':result.get('post_id'),'photo_id':result.get('id')}))
          PY
