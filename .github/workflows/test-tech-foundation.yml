name: Test tech research foundation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tech-show-research-foundation
      - name: Install runtime dependency
        run: python -m pip install requests
      - name: Run offline quality and source-selection tests
        run: python -m unittest discover -s tech_show/tests -v
      - name: Test read-only research using fixed historical date
        run: python tech_show/research.py --as-of 2026-10-29T12:00:00+05:30 --out /tmp/tech-candidates.json
