name: Verify LLM gateway

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NR_LLM_API_BASE: ${{ vars.NR_LLM_API_BASE || 'https://api.x.ai/v1' }}
      NR_LLM_MODEL: ${{ vars.NR_LLM_MODEL || 'grok-4.7' }}
      NR_VALIDATOR_MODEL: ${{ vars.NR_VALIDATOR_MODEL || 'grok-4.6' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check model gateway without printing keys
        run: |
          python - <<'PY'
          import os
          import requests

          keys = {
              "GROK_API_KEY": os.getenv("GROK_API_KEY"),
              "OPENAI_API_KEY": os.getenv("OPENAI_API_KEY"),
          }
          bases = [
              os.getenv("NR_LLM_API_BASE") or "https://api.x.ai/v1",
              "https://api.openai.com/v1",
          ]

          def safe(text: str, *secrets: str) -> str:
              for secret in secrets:
                  if secret:
                      text = text.replace(secret, "[REDACTED]")
              return text[:800]

          any_ok = False
          openai_chat_ok = False
          for name, key in keys.items():
              if not key:
                  print(name, "MISSING")
                  continue
              print(name, "present", len(key), "characters")
              for base in bases:
                  try:
                      r = requests.get(
                          base.rstrip("/") + "/models",
                          headers={"Authorization": "Bearer " + key},
                          timeout=30,
                      )
                      body = safe(r.text, key)
                      print(name, base, "models HTTP", r.status_code, body)
                      if r.status_code == 200:
                          any_ok = True
                          ids = [m.get("id") for m in r.json().get("data", [])]
                          prefixes = ("gpt-4", "gpt-5", "o1", "o3", "o4")
                          candidates = [x for x in ids if any(x.startswith(p) for p in prefixes)]
                          print("chat-capable candidates:", candidates[:60])
                  except Exception as exc:
                      print(name, base, "network error", type(exc).__name__)

          grok_key = keys.get("GROK_API_KEY")
          if grok_key:
              base = (os.getenv("NR_LLM_API_BASE") or "https://api.x.ai/v1").rstrip("/")
              for model in [os.getenv("NR_LLM_MODEL") or "grok-4.7",
                            os.getenv("NR_VALIDATOR_MODEL") or "grok-4.6"]:
                  try:
                      r = requests.post(
                          base + "/chat/completions",
                          headers={"Authorization": "Bearer " + grok_key},
                          json={"model": model,
                                "messages": [{"role": "user", "content": "Reply with the single word OK."}],
                                "max_tokens": 5},
                          timeout=60,
                      )
                      body = safe(r.text, grok_key)
                      print("grok chat", model, "HTTP", r.status_code, body)
                      if r.status_code == 200:
                          any_ok = True
                  except Exception as exc:
                      print("grok chat", model, "network error", type(exc).__name__)

          openai_key = keys.get("OPENAI_API_KEY")
          if openai_key:
              base = "https://api.openai.com/v1"
              for model in ["gpt-4o", "gpt-4o-mini", "gpt-5-chat-latest"]:
                  try:
                      r = requests.post(
                          base + "/chat/completions",
                          headers={"Authorization": "Bearer " + openai_key},
                          json={"model": model,
                                "messages": [{"role": "system", "content": "Return JSON only."},
                                             {"role": "user", "content": "Return {\"ok\":true}"}],
                                "max_tokens": 20,
                                "response_format": {"type": "json_object"}},
                          timeout=60,
                      )
                      body = safe(r.text, openai_key)
                      print("openai chat", model, "HTTP", r.status_code, body)
                      if r.status_code == 200:
                          any_ok = True
                          openai_chat_ok = True
                  except Exception as exc:
                      print("openai chat", model, "network error", type(exc).__name__)

          print("ANY_GATEWAY_OK", any_ok)
          print("OPENAI_CHAT_OK", openai_chat_ok)
          PY
