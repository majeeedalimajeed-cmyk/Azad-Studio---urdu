name: Verify LLM gateway
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Check backup model pool without publishing
        env:
          TEST_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEST_GROQ_KEY: ${{ secrets.GROK_API_KEY }}
        run: python scripts/check_model_pool.py
