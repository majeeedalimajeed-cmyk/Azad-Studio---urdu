name: Publish approved water-news card
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: approved-water-card-20261102
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NR_SKIP_DOTENV: '1'
      NR_FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      NR_FB_USER_ACCESS_TOKEN: ${{ secrets.FB_USER_ACCESS_TOKEN }}
      NR_FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      NR_GRAPH_API_VERSION: ${{ vars.NR_GRAPH_API_VERSION }}
      NR_EXPECTED_PAGE_NAME: ${{ vars.NR_EXPECTED_PAGE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify page, check duplicates, publish the approved card once
        run: |
          python - <<'PY'
          import json, sys
          from nr_news.facebook import FacebookGraphClient
          from nr_news.config import CONFIG
          marker = 'AZAD-STUDIO-WATER-20261102'
          client = FacebookGraphClient(config=CONFIG)
          identity = client.verify_identity()
          if not identity.get('ok'):
              print('HOLD: Page identity verification failed:', identity.get('reason'))
              sys.exit(1)
          page_id = identity['page_id']
          token = client.publishing_token(page_id)
          try:
              feed = client._call('GET', f'/{page_id}/feed', token=token,
                                  params={'fields': 'id,message,created_time', 'limit': 100})
          except Exception as exc:
              print('HOLD: Could not check Page feed; no upload attempted.', type(exc).__name__, str(exc)[:500])
              sys.exit(1)
          for post in feed.get('data', []):
              if marker in str(post.get('message', '')):
                  print(json.dumps({'status': 'already_posted', 'post_id': post.get('id')}))
                  sys.exit(0)
          caption = ('Revanth Reddy urges wider use of treated wastewater for non-drinking needs in Hyderabad.\n\n'
                     'Revanth Reddy ne ghair-peene ke kaamon ke liye treated pani ka zyada istemal karne ki appeal ki.\n\n'
                     'Photo: Prime Minister’s Office, Government of India, via Wikimedia Commons; '
                     '2024 file photo, cropped and resized; Government Open Data License – India.\n'
                     'https://commons.wikimedia.org/wiki/File:Shri_Anumula_Revanth_Reddy_(cropped).jpg\n'
                     'https://data.gov.in/sites/default/files/Gazette_Notification_OGDL.pdf\n\n' + marker)
          result = client.publish_photo(page_id, 'approved_cards/2026-11-02-water.png', caption)
          print(json.dumps({'status': 'published', 'post_id': result.get('post_id'), 'photo_id': result.get('id')}))
          PY
