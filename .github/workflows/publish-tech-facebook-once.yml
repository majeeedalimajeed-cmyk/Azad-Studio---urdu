name: One-time tech episode Facebook publish
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: azad-tech-facebook-once
  cancel-in-progress: false
jobs:
  publish:
    runs-on: [self-hosted, azad-ephemeral-tech-publisher]
    timeout-minutes: 20
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      EXPECTED_PAGE_NAME: ${{ vars.NR_EXPECTED_PAGE_NAME || 'Azad Studio' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Verify identity and publish once with durable claims
        run: python /home/user/azad_tech_show/facebook_publish_once.py
