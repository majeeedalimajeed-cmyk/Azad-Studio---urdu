name: Hourly newsroom scan

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-newsroom
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      NR_SKIP_DOTENV: "1"
      NR_GITHUB_LEDGER_TOKEN: ${{ github.token }}
      NR_DRY_RUN: ${{ vars.NR_DRY_RUN }}
      NR_PUBLISH_ENABLED: ${{ vars.NR_PUBLISH_ENABLED }}
      NR_PUBLISH_SAFETY_OK: ${{ vars.NR_PUBLISH_SAFETY_OK }}
      NR_OPERATOR_APPROVED: ${{ vars.NR_OPERATOR_APPROVED }}
      NR_VERIFY_APPROVED: ${{ vars.NR_VERIFY_APPROVED }}
      NR_AUTO_APPROVE_VERIFIED: ${{ vars.NR_AUTO_APPROVE_VERIFIED }}
      NR_AUTO_POST_ENABLED: ${{ vars.NR_AUTO_POST_ENABLED }}
      NR_GRAPH_API_VERSION: ${{ vars.NR_GRAPH_API_VERSION }}
      NR_EXPECTED_PAGE_NAME: ${{ vars.NR_EXPECTED_PAGE_NAME }}
      NR_FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      NR_FB_USER_ACCESS_TOKEN: ${{ secrets.FB_USER_ACCESS_TOKEN }}
      NR_FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      NR_LLM_API_KEY: ${{ secrets.GROK_API_KEY }}
      NR_LLM_API_BASE: ${{ vars.NR_LLM_API_BASE }}
      NR_LLM_MODEL: ${{ vars.NR_LLM_MODEL }}
      NR_ROMAN_URDU_MODEL: ${{ vars.NR_ROMAN_URDU_MODEL }}
      NR_VALIDATOR_MODEL: ${{ vars.NR_VALIDATOR_MODEL }}
      NR_PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      NR_PIXABAY_ENABLED: "false"
      NR_INSTAGRAM_ENABLED: "false"
      NR_VIDEO_ENABLED: "false"
      NR_YOUTUBE_ENABLED: "false"
      NR_YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      NR_YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      NR_YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      NR_SHORTS_MORNING_HOUR: ${{ vars.NR_SHORTS_MORNING_HOUR || '9' }}
      NR_SHORTS_EVENING_HOUR: ${{ vars.NR_SHORTS_EVENING_HOUR || '19' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install RTL runtime dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libraqm0 ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify durable publishing ledger
        if: github.event_name == 'workflow_dispatch'
        run: python -m nr_news.publication_ledger

      - name: Restore durable SQLite database
        uses: actions/cache@v4
        with:
          path: |
            data/nr_news.sqlite3
            data/media
          key: nr-news-db-${{ github.run_id }}
          restore-keys: |
            nr-news-db-

      - name: Initialize audit database
        run: python -m nr_news.cli init

      - name: Verify Page identity
        run: python -m nr_news.cli verify-facebook

      - name: Hourly source scan and verification jobs
        run: |
          python -m nr_news.cli scan --mode hourly --drain-limit 20
          python -m nr_news.cli worker --limit 20

      - name: YouTube Shorts cycle (breaking + 09:00/19:00 IST best-news batches)
        run: python -m nr_news.cli shorts-cycle

      - name: Generate operations report
        run: python -m nr_news.cli report --output reports/DRY_RUN_REPORT.md

      - name: Write run summary
        run: |
          {
            echo "## AZAD STUDIO hourly newsroom"
            echo "- Auto post: \`${{ vars.NR_AUTO_POST_ENABLED }}\`"
            echo "- Dry run: \`${{ vars.NR_DRY_RUN }}\`"
            echo "- Publish enabled: \`${{ vars.NR_PUBLISH_ENABLED }}\`"
            echo "- Safety interlock: \`${{ vars.NR_PUBLISH_SAFETY_OK }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cards, audits and reports
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-run-${{ github.run_id }}
          path: |
            data/cards/*.png
            data/audit/*.json
            data/video/*/short.mp4
            reports/*.md
          if-no-files-found: warn
