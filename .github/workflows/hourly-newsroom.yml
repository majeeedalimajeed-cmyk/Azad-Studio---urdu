name: Hourly newsroom scan

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-newsroom
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install RTL runtime dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libraqm0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore durable SQLite database
        uses: actions/cache@v4
        with:
          path: data/nr_news.sqlite3
          key: nr-news-db-${{ github.run_id }}
          restore-keys: |
            nr-news-db-

      - name: Initialize audit database
        run: python -m nr_news.cli init

      - name: Verify Page identity
        env:
          NR_GRAPH_API_VERSION: ${{ vars.NR_GRAPH_API_VERSION }}
          NR_EXPECTED_PAGE_NAME: ${{ vars.NR_EXPECTED_PAGE_NAME }}
          NR_FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          NR_FB_USER_ACCESS_TOKEN: ${{ secrets.FB_USER_ACCESS_TOKEN }}
          NR_FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python -m nr_news.cli verify-facebook

      - name: Hourly source scan and verification jobs
        env:
          NR_DRY_RUN: ${{ vars.NR_DRY_RUN }}
          NR_PUBLISH_ENABLED: ${{ vars.NR_PUBLISH_ENABLED }}
          NR_GRAPH_API_VERSION: ${{ vars.NR_GRAPH_API_VERSION }}
          NR_EXPECTED_PAGE_NAME: ${{ vars.NR_EXPECTED_PAGE_NAME }}
          NR_FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          NR_FB_USER_ACCESS_TOKEN: ${{ secrets.FB_USER_ACCESS_TOKEN }}
          NR_FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          NR_LLM_API_KEY: ${{ secrets.GROK_API_KEY }}
          NR_LLM_API_BASE: ${{ vars.NR_LLM_API_BASE }}
          NR_LLM_MODEL: ${{ vars.NR_LLM_MODEL }}
          NR_ROMAN_URDU_MODEL: ${{ vars.NR_ROMAN_URDU_MODEL }}
          NR_VALIDATOR_MODEL: ${{ vars.NR_VALIDATOR_MODEL }}
        run: |
          python -m nr_news.cli scan --mode hourly --drain-limit 100
          python -m nr_news.cli worker --limit 100

      - name: Generate dry-run report
        env:
          NR_EXPECTED_PAGE_NAME: ${{ vars.NR_EXPECTED_PAGE_NAME }}
        run: python -m nr_news.cli report --output reports/DRY_RUN_REPORT.md

      - name: Upload cards, audits and reports
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-run-${{ github.run_id }}
          path: |
            data/cards/*.png
            data/audit/*.json
            reports/*.md
          if-no-files-found: warn
