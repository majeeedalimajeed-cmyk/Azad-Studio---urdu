name: Verify Facebook Page identity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore durable SQLite database
        uses: actions/cache@v4
        with:
          path: data/nr_news.sqlite3
          key: nr-news-db-${{ github.run_id }}
          restore-keys: |
            nr-news-db-

      - name: Initialize audit database
        run: python -m nr_news.cli init

      - name: Inspect Page token
        env:
          NR_FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          NR_FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          NR_GRAPH_API_VERSION: ${{ vars.NR_GRAPH_API_VERSION || 'v26.0' }}
        run: |
          python - <<'PY'
          import os
          import requests
          token = os.getenv("NR_FB_PAGE_ACCESS_TOKEN") or ""
          page_id = os.getenv("NR_FB_PAGE_ID") or ""
          version = os.getenv("NR_GRAPH_API_VERSION") or "v26.0"
          base = "https://graph.facebook.com/" + version

          def safe(text: str) -> str:
              return text.replace(token, "[REDACTED]")[:600]

          for path in ["/me", "/" + page_id, "/" + page_id + "/feed"]:
              try:
                  r = requests.get(base + path, params={"fields": "id,name,message,created_time"},
                                   headers={"Authorization": "Bearer " + token}, timeout=30)
                  print("PAGE_TOKEN_CHECK", path, "HTTP", r.status_code, safe(r.text))
              except Exception as exc:
                  print("PAGE_TOKEN_CHECK", path, "network error", type(exc).__name__)
          PY

      - name: Resolve and confirm Page via Graph API
        env:
          NR_SKIP_DOTENV: "1"
          NR_GRAPH_API_VERSION: ${{ vars.NR_GRAPH_API_VERSION }}
          NR_EXPECTED_PAGE_NAME: ${{ vars.NR_EXPECTED_PAGE_NAME }}
          NR_FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          NR_FB_USER_ACCESS_TOKEN: ${{ secrets.FB_USER_ACCESS_TOKEN }}
          NR_FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python -m nr_news.cli verify-facebook
