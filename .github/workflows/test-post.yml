name: Operator-approved public test post

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-test-post
  cancel-in-progress: false

jobs:
  test-post:
    runs-on: ubuntu-latest
    env:
      NR_SKIP_DOTENV: "1"
      NR_DRY_RUN: "false"
      NR_PUBLISH_ENABLED: "true"
      NR_PUBLISH_SAFETY_OK: "true"
      NR_OPERATOR_APPROVED: "true"
      NR_VERIFY_APPROVED: "true"
      NR_AUTO_APPROVE_VERIFIED: "true"
      NR_AUTO_POST_ENABLED: "true"
      NR_GRAPH_API_VERSION: ${{ vars.NR_GRAPH_API_VERSION || 'v26.0' }}
      NR_EXPECTED_PAGE_NAME: ${{ vars.NR_EXPECTED_PAGE_NAME }}
      NR_FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || vars.NR_FB_PAGE_ID }}
      NR_FB_USER_ACCESS_TOKEN: ${{ secrets.FB_USER_ACCESS_TOKEN }}
      NR_FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      NR_LLM_API_KEY: ${{ secrets.GROK_API_KEY }}
      NR_LLM_API_BASE: ${{ vars.NR_LLM_API_BASE || 'https://api.x.ai/v1' }}
      NR_LLM_MODEL: ${{ vars.NR_LLM_MODEL || 'grok-4.7' }}
      NR_ROMAN_URDU_MODEL: ${{ vars.NR_ROMAN_URDU_MODEL || 'grok-4.7' }}
      NR_VALIDATOR_MODEL: ${{ vars.NR_VALIDATOR_MODEL || 'grok-4.6' }}
      NR_PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      NR_PIXABAY_ENABLED: ${{ vars.NR_PIXABAY_ENABLED || 'true' }}
      NR_INSTAGRAM_ENABLED: ${{ vars.NR_INSTAGRAM_ENABLED || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install RTL runtime dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libraqm0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore durable SQLite database
        uses: actions/cache@v4
        with:
          path: data/nr_news.sqlite3
          key: nr-news-db-${{ github.run_id }}
          restore-keys: |
            nr-news-db-

      - name: Initialize audit database
        run: python -m nr_news.cli init

      - name: Verify Page identity
        run: python -m nr_news.cli verify-facebook

      - name: Publish and confirm operator-approved test post
        run: python -m nr_news.cli bootstrap-test-post --i-understand-this-posts-publicly

      - name: Generate operations report
        run: python -m nr_news.cli report --output reports/DRY_RUN_REPORT.md

      - name: Write test post summary
        run: |
          {
            echo "## AZAD STUDIO public test post"
            cat reports/TEST_POST_RESULT.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test post evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-test-post-${{ github.run_id }}
          path: |
            data/cards/*.png
            data/audit/*.json
            reports/TEST_POST_RESULT.md
            reports/DRY_RUN_REPORT.md
          if-no-files-found: error
